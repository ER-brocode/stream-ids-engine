[package]
name = "stream-ids-engine"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Real-Time Anomaly & Intrusion Detection System in Rust"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "stream-ids"
path = "src/main.rs"

[lib]
name = "stream_ids"
path = "src/lib.rs"
